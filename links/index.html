:root{--sky1:#5fb6f2;--sky2:#bfe6ff;--sun:#ffcf2e;--sun2:#ffb703;--grass:#5cb85c;--grass2:#3f9a43;--red:#e8453c;--denim:#2f5f99;--cream:#fff8e8;--ink:#1f2d3d;--soft:#4d5d6c}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 55%,var(--cream) 100%);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px;text-align:center}
.logo{display:block;width:100%;max-width:440px;height:auto;margin:0 auto 6px;filter:drop-shadow(0 8px 14px rgba(0,0,0,.18))}
p.tag{margin:0 0 20px;font-family:"Fredoka",ui-rounded,system-ui,sans-serif;font-size:20px}
.b{display:block;margin:0 0 14px;padding:16px 20px;border-radius:999px;font-family:"Fredoka",ui-rounded,system-ui,sans-serif;font-weight:700;font-size:21px;text-decoration:none;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.18);transition:transform .15s}
.b:hover{transform:translateY(-3px)}
.yt{background:#e8453c}.sp{background:#1db954}.am{background:#fa2d48}.ig{background:#c13584}.tt{background:#111}.fb{background:#1877f2}
.shop{background:var(--sun);color:var(--ink);box-shadow:0 6px 0 var(--sun2)}.join{background:var(--grass);box-shadow:0 6px 0 var(--grass2)}
.small{color:var(--soft);font-size:14px;margin-top:22px}.small a{color:var(--denim)}
</style>
